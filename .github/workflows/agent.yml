name: Codex job agent

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run applypilot-agent --help
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check src/applypilot_agent tests/agent
      - run: uv run ruff format --check src/applypilot_agent tests/agent
      - run: uv run python -m pytest tests/agent -q
      - run: uv run python -m applypilot_agent.evaluation --config configs/evaluation.yaml
      - run: uv build
