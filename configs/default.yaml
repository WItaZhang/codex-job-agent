# 所有阈值和参数都在这里，代码中不写死。
scoring:
  level_points: {strong_avoid: -2, avoid: -1, prefer: 1, strong_prefer: 2}
  recommend_threshold: 1          # 推荐线 θ：未被排除且分数 ≥ θ 视为"推荐"
  salary_below_floor_penalty: 2   # 岗位薪资低于下限时扣的分（软条件）
  salary_compare: max             # 岗位给出薪资区间时，取哪个值与下限比较：max | min
daily:
  recommended: 7
  exploration: 3
  exploration_max_from_avoid: 3  # 探索位中最多几个取自"命中回避条目"的岗位，其余从排名中段补齐
analysis:
  max_causes: 6                   # 第一步最多展示几个候选原因
  max_flipped_shown: 3            # 每个方案最多列出几个被翻转的历史岗位
discovery:
  timeout_seconds: 20             # 单个招聘板接口的超时
  boards_file: boards.yaml        # 关注的公司列表，位于 storage.data_dir 下
  untagged_batch: 20              # 每次最多列出多少个待打标签的岗位（有完整原文的在前，再按最新）
  full_text_chars: 200            # 描述达到这个长度才算"完整原文"（沿用 ApplyPilot 的阈值）
  applypilot_dir: applypilot      # ApplyPilot 工作库与配置的目录，位于 storage.data_dir 下
  enrich_limit: 100               # 补全原文时每个站点最多处理多少个岗位（ApplyPilot 默认值）
  proxy_env: INTENT_AGENT_PROXY   # 代理所在的环境变量，格式 host:port 或 host:port:user:pass
  avature:                        # Avature 招聘站点（spec §10 第 39–48 条）
    request_delay_seconds: 0.5    # 同一次抓取中两次请求之间的间隔
    max_pages: 300                # 每个站点最多读多少页列表，超过就算抓取失败
tagging:
  daily_budget: 2000              # 每天最多给多少个岗位打完整标签（漏斗第 5 层）
  backfill_dimensions: [degree_requirement]   # 新增维度后，已打标签岗位要回填的维度（spec §10 第 28 条）
hard_review:
  every_days: 7
apply_list:                       # 投递清单（spec 4.9）
  agreement_window_days: 7        # 一致率看最近几个标注日（打过 label 的推荐日）
  shown: 20                       # 对话里先列出几个；文件里是全部
  dir: apply                      # 清单文件所在的目录，位于 storage.data_dir 下
duplicates:                       # 同一个岗位的几条（spec 4.9 第 6 条；投递清单和每日推荐都用）
  shingle_words: 5                # 正文切成连续几个词的片段（spec §10 第 71 条）
  overlap: 0.9                    # 较短一份的片段至少有多少出现在较长一份里，才算正文基本一样
apply:                            # 投递（spec 4.10）
  applicant_dir: applicant        # 投递资料目录（applicant.yaml、profile.json、简历），位于 storage.data_dir 下
  batch_size: 30                  # 一批最多多少个岗位
  review_first: 5                 # 每批先抽查几个，停在提交前给你检查
  model: claude-opus-5-5          # 投递用的 Claude Code 模型，填表模块也用它（spec 4.10 第 9 条；写完整的模型名）
  job_timeout_seconds: 900        # 单个岗位最长时间
  letters_dir: apply/letters      # 求职信（.txt 和 .pdf），位于 storage.data_dir 下
  logs_dir: apply/logs            # 投递过程的完整记录，位于 storage.data_dir 下
  cover_letter:
    min_words: 250
    max_words: 400
    max_attempts: 3               # 校验不过最多重写几次
    read_chars: 12000             # 求职信材料每次最多读出多少字符，长文件分段读（一次返回太长会被宿主存成文件）
  mcp:                            # 投递 agent 用的 MCP 服务，固定版本
    playwright: "@playwright/mcp@0.0.83"
    gmail: "@gongrzhe/server-gmail-autoauth-mcp@1.1.11"
  blocked_origins:                # 投递用的浏览器打不开的网站（不是严格的安全边界，不拦重定向）
    - https://mail.google.com
    - https://myaccount.google.com
    - https://pay.google.com
    - https://payments.google.com
    - https://wallet.google.com
    - https://drive.google.com
    - https://outlook.live.com
    - https://outlook.office.com
    - https://mail.yahoo.com
    - https://www.icloud.com
    - https://appleid.apple.com
    - https://mail.qq.com
    - https://wx.qq.com
    - https://mail.163.com
    - https://www.dropbox.com
    - https://onedrive.live.com
    - https://www.paypal.com
    - https://venmo.com
    - https://cash.app
    - https://www.alipay.com
    - https://auth.alipay.com
    - https://www.chase.com
    - https://secure.chase.com
    - https://www.bankofamerica.com
    - https://secure.bankofamerica.com
    - https://www.wellsfargo.com
    - https://connect.secure.wellsfargo.com
    - https://online.citi.com
    - https://www.capitalone.com
    - https://verified.capitalone.com
    - https://www.americanexpress.com
    - https://global.americanexpress.com
    - https://www.discover.com
    - https://www.schwab.com
    - https://www.fidelity.com
    - https://robinhood.com
    - https://www.coinbase.com
    - https://www.ssa.gov
    - https://secure.ssa.gov
    - https://www.irs.gov
    - https://vault.bitwarden.com
    - https://my.1password.com
    - https://www.lastpass.com
    - https://api.capsolver.com     # 破解验证码的服务：系统永远不破解（spec §10 第 98 条），多一层保险
    - https://2captcha.com
    - https://api.2captcha.com
    - https://api.anti-captcha.com
    - https://api.capmonster.cloud
  builtin_tools: ""               # 投递 agent 可用的 Claude Code 内置工具（--tools）；空 = 一个都没有
  file_tools: "Read,Glob,Grep"    # applicant.yaml 列了 apply_agent_read 时改用这些（只读），并以 --restricted 运行
  permission_mode: default        # 不跳过权限检查（ApplyPilot 用 bypassPermissions）；只放行下面的白名单
  allowed_tools:                  # 预先放行的工具，其余一律自动拒绝
    - mcp__playwright             # Playwright MCP 的浏览器工具
    - mcp__gmail__search_emails   # 找验证码（填表 agent 也能用，spec §10 第 105 条）
    - mcp__gmail__read_email
    - mcp__gmail__send_email      # 只接受邮件投递的岗位
  disallowed_tools:               # ApplyPilot 关掉的 Gmail 工具（多一层保险）
    - mcp__gmail__draft_email
    - mcp__gmail__modify_email
    - mcp__gmail__delete_email
    - mcp__gmail__download_attachment
    - mcp__gmail__batch_modify_emails
    - mcp__gmail__batch_delete_emails
    - mcp__gmail__create_label
    - mcp__gmail__update_label
    - mcp__gmail__delete_label
    - mcp__gmail__get_or_create_label
    - mcp__gmail__list_email_labels
    - mcp__gmail__create_filter
    - mcp__gmail__list_filters
    - mcp__gmail__get_filter
    - mcp__gmail__delete_filter
  chrome_profile_strip:           # 复制日常 Chrome 资料后删掉：保存的密码、银行卡、表单自动填充
    - Login Data
    - Login Data-journal
    - Login Data For Account
    - Login Data For Account-journal
    - Web Data
    - Web Data-journal
    - Account Web Data
    - Account Web Data-journal
  done:                           # 完成标准（spec §9），apply_stats 按周对照
    weekly_target: 200            # 每周至少成功提交多少份
    success_rate: 0.8             # 成功提交 ÷（成功提交 + 没交出去的）至少多少
    allowed:                      # 允许的失败类别（结果码到类别的对照表在 apply_fill.py）
      - login                     # 登录、注册失败或只能单点登录
      - captcha                   # 验证码
      - arbitration               # 仲裁协议
      - ssn                       # 要填 SSN
      - payment                   # 要付款或填银行卡
      - no_ai                     # 筛选题要本人作答、不许用 AI
      - expired                   # 岗位已下架
      - timeout                   # 网络超时
  notify: true                    # 一步做完、有岗位等你处理或填好等你检查时，发一条 Mac 系统通知（spec 4.10 第 10 条）
  watchdog:                       # 一步一定能结束（spec 4.10 第 11 条，§10 第 107、108、114 条）
    stall_seconds: 300            # agent 多久没有任何输出就算卡住（stalled）：结束它和它启动的进程，接着做下一个
    drain_seconds: 10             # agent 退出后，最多再等多久读完它剩下的输出
    read_seconds: 120             # 代码读一次标签页（读回、接着做前读一眼）最长多久
    interval_seconds: 3           # agent 运行时多久看一次它的进程和投递用的 Chrome
form_fill:                        # 填表模块（specs/form-fill.md；切片计划见 specs/form-fill.plan.md、form-fill.slice2a.plan.md）。模型和超时沿用 apply.*
  dir: form-fill                  # 运行目录，位于 storage.data_dir 下：runs/<运行编号>/<岗位 id>/ 和 feasibility.md
  recordings_dir: recordings      # 录制目录，位于 form_fill.dir 下：recordings/<录制编号>/（spec 6.2）
  answers_file: answers.yaml      # 标准答案，位于 apply.applicant_dir 下
  checklist_file: checklist.yaml  # 要求清单，位于 apply.applicant_dir 下
  lists_dir: lists                # 岗位清单，位于 form_fill.dir 下；/apply 每一步写一份 <批次>-<步>.yaml（spec §10 第 87 条）
  disallowed_tools:               # 填表 agent 另外禁用的工具，叠加在 apply.disallowed_tools 上（spec 5.6）
    - mcp__playwright__browser_run_code_unsafe   # 在服务进程里执行任意代码，等于有了命令行
    - mcp__playwright__browser_close             # 会关掉你正在检查的标签页
    - mcp__playwright__browser_network_request   # 这两个会把带 Cookie 的请求头交给模型，进而写进运行记录
    - mcp__playwright__browser_network_requests
    - mcp__gmail__send_email                     # 填表 agent 只能搜索、读邮件找验证码，永远不发信（spec §10 第 105 条）
  checkpoint_timeout_seconds: 5   # checkpoint 在这个时间内返回（spec 6.1 第 3 项）
  watch_interval_seconds: 1       # 后台补录读页的间隔（spec 4.2）
  stuck_after: 3                  # 同一页连续几次 checkpoint("filled") 没换页就让填表 agent 停下（spec 4.2）
  network_max_mb: 30              # 第一页网络记录的上限（spec 6.2）
llm:
  provider: host                  # host：理解由对话中的宿主 agent 以工具参数提供；fake 仅用于测试；anthropic | openai_compatible 以后实现
  model: null
  api_key_env: null
storage:
  db_path: data/local/agent.sqlite
  data_dir: data/local            # 导入岗位、初始化意图时只读取这个目录下的文件
