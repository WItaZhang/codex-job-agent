# 所有阈值和参数都在这里，代码中不写死。
scoring:
  level_points: {strong_avoid: -2, avoid: -1, prefer: 1, strong_prefer: 2}
  recommend_threshold: 1          # 推荐线 θ：未被排除且分数 ≥ θ 视为"推荐"
  salary_below_floor_penalty: 2   # 岗位薪资低于下限时扣的分（软条件）
  salary_compare: max             # 岗位给出薪资区间时，取哪个值与下限比较：max | min
daily:
  recommended: 7
  exploration: 3
  exploration_max_from_avoid: 3  # 探索位中最多几个取自"命中回避条目"的岗位，其余从排名中段补齐
analysis:
  max_causes: 6                   # 第一步最多展示几个候选原因
  max_flipped_shown: 3            # 每个方案最多列出几个被翻转的历史岗位
discovery:
  timeout_seconds: 20             # 单个招聘板接口的超时
  boards_file: boards.yaml        # 关注的公司列表，位于 storage.data_dir 下
  untagged_batch: 20              # 每次最多列出多少个待打标签的岗位（最新抓到的在前）
hard_review:
  every_days: 7
llm:
  provider: host                  # host：理解由对话中的宿主 agent 以工具参数提供；fake 仅用于测试；anthropic | openai_compatible 以后实现
  model: null
  api_key_env: null
storage:
  db_path: data/local/agent.sqlite
  data_dir: data/local            # 导入岗位、初始化意图时只读取这个目录下的文件
