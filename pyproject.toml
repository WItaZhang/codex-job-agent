[project]
name = "intent-job-agent"
version = "0.1.0"
description = "Job discovery agent that maintains user intent from daily feedback"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pandas>=3.0.6",
    "playwright==1.56.0",
    "pydantic>=2.14.0",
    "python-jobspy>=1.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
intent-job-agent = "intent_job_agent.workspace:main"
intent-job-agent-mcp = "intent_job_agent.mcp_server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
extend-exclude = ["src/intent_job_agent/vendor"]  # vendored ApplyPilot code is kept verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/intent_job_agent"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "intent_job_agent_data/default.yaml"
".claude/skills/cover-letter" = "intent_job_agent_data/cover-letter"

[tool.hatch.build.targets.sdist]
exclude = ["/scripts/ci_browser_userns.py"]
only-include = ["src", "tests", "configs/default.yaml", ".claude/skills/cover-letter", "pyproject.toml", "uv.lock", "LICENSE", "NOTICE.md", "README.md", "scripts"]

[tool.uv]
# These replace uv defaults; preserve project/build inputs and track the unique resource sources.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { dir = "src" }, { file = "configs/default.yaml" }, { file = ".claude/skills/cover-letter/**/*" }]
