[project]
name = "codex-job-agent"
version = "0.1.0"
description = "A personal job-search agent built for Codex, with repository skills and evidence-bound local tools"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{name = "WItaZhang"}]
keywords = ["codex", "agent", "skills", "job-search", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.24",
    "playwright>=1.40",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0",
    "typer>=0.9.0",
]

[project.scripts]
applypilot-agent = "applypilot_agent.cli:app"

[project.urls]
Homepage = "https://github.com/WItaZhang/codex-job-agent"
Repository = "https://github.com/WItaZhang/codex-job-agent"
Issues = "https://github.com/WItaZhang/codex-job-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
memory-eval = [
    "langmem>=0.0.30,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/applypilot_agent",
    "/.agents/skills",
    "/configs",
    "/docs",
    "/evals",
    "/tests/agent",
    "/.python-version",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE.md",
    "/README.md",
    "/README.zh-CN.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 120
