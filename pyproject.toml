[project]
name = "intent-job-agent"
version = "0.1.0"
description = "Job discovery agent that maintains user intent from daily feedback"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
intent-job-agent-mcp = "intent_job_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
