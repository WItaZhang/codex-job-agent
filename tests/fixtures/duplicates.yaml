# SYNTHETIC — 切片 5b 的样例（plan.md 切片 5b 第 3 节）。公司、岗位、链接和正文都是编的，
# 形状照 2026-10-14 那一批里同一个岗位从不同网站来了几条的真实情况：
#   acme  ← Stripe：LinkedIn 上三个城市各一条，正文相同
#   beta  ← Handshake：Indeed、LinkedIn（正文截断）、ZipRecruiter（多一个标题行）
#   gamma ← RK Infotech：公司名一条带 LLC、一条不带
#   delta ← Adobe：官网 Workday 上两个编号，正文只差年限和薪资；另有一条 LinkedIn 和两个编号都像
#   theta ← NVIDIA：同一个 Workday 编号有两个链接（地点路径不同，末尾多了 -1）
#   nocomp ← Talent.com：公司名为空
#   acme-glassdoor、eta ← Glassdoor：没有正文（库里存的是字符串 "None"），只能按地点判断
# 正文由 paragraphs 拼接；cut 只保留前 N 个词，heading 加在最前面；raw 直接给出存下来的正文。
# 切片 5c 的样例（plan.md 切片 5c 第 3 节，样例 20–31）在 listings_5c / postings_5c 里：同样是编的，形状照
# 2026-10-15 在真实数据只读副本上看到的情况（括号里是对应的真实公司）。为了让代码认出招聘系统，链接用招聘系统
# 真实的格式（jobs.lever.co、smartrecruiters 等），只是字符串，测试不会打开它们。tags 是完整的标签（地点、company）；
# application_url 是招聘网站抓取时记下的投递链接；append 加在正文最后。

synthetic: true

paragraphs:
  about_acme: >-
    About Acme Pay. Acme Pay is a synthetic payments company that helps small shops accept cards, send invoices
    and settle money across borders. Our teams are small, write a lot, and ship to production every day.
  role_acme: >-
    The Risk team builds the models that decide in a few milliseconds whether a payment is fraudulent. As a
    machine learning engineer on Risk you will design features from payment graphs, train and evaluate gradient
    boosted and deep models, run online experiments, and own the serving path end to end with the platform team.
    You have shipped models to production, you are fluent in Python and SQL, and you enjoy explaining tradeoffs to
    product partners. Experience with streaming systems or graph features is a plus but not required.
  about_beta: >-
    About Beta. Beta was founded on the belief that every student deserves a path to a first job, whatever school
    they went to and whoever they know. Our platform connects students with employers and with each other.
  role_beta: >-
    As a machine learning engineer you will improve how students discover jobs and how employers discover
    students. You will build ranking and recommendation models, design offline metrics that predict online wins,
    and run experiments with product and design. You will work across retrieval, ranking and the feature store,
    and you will mentor interns. We are looking for someone with production experience in recommendation systems,
    strong Python, and a habit of measuring before and after every change.
  role_gamma: >-
    Job Title: AI and ML Engineer, Entry Level. Employment Type: Full-Time. Gamma Infotech is hiring an entry level
    engineer to build and deploy machine learning models for client projects in retail and logistics. You will
    clean data, train models in Python, package them as services, and monitor them after release. A degree in
    computer science or a related field is required, together with a working knowledge of cloud platforms.
  about_delta: >-
    Delta is seeking a machine learning engineer to join the Delta Trust Platform team. The team protects millions
    of customers and their accounts from abuse, fraud and account takeover across every Delta product. You will
    partner with data scientists, product managers and security analysts to turn research into reliable systems.
  role_delta: >-
    What you will do. Design, train and deploy models that detect abusive sign ups, payment fraud and compromised
    accounts. Build real time feature pipelines and model serving that meet strict latency budgets. Own the
    quality of the models you ship, from offline evaluation to online monitoring, alerting and retraining. Work
    with engineers across the company to integrate risk signals into checkout, sign in and support tools. Write
    clear design documents and review the work of your peers. What you need to succeed. Strong programming skills
    in Python and one of Java, Scala or Go. Hands on experience with modern machine learning frameworks and with
    large scale data processing. A track record of taking models from prototype to production and keeping them
    healthy. Good judgement about precision, recall and the cost of mistakes for real customers.
  years_3: >-
    Three or more years of professional experience building and deploying machine learning solutions, or
    equivalent experience through internships, research, or personal projects.
  years_5: >-
    Five or more years of professional experience building and deploying machine learning solutions, or
    equivalent experience through internships, research, or personal projects.
  pay_low: >-
    The pay range for this position is one hundred twenty five thousand to two hundred thirty four thousand
    dollars annually.
  pay_high: >-
    The pay range for this position is one hundred fifty one thousand to two hundred sixty five thousand dollars
    annually.
  benefits_delta: >-
    Delta offers medical, dental and vision coverage, a retirement plan with a company match, paid parental leave,
    and a yearly learning budget. We are an equal opportunity employer and we welcome applicants of every
    background. Applications are reviewed on a rolling basis until the position is filled.
  about_theta: >-
    Theta builds accelerated computing systems. The data engineering team owns the pipelines that collect test
    results from every chip that leaves the factory. As a data engineer you will design schemas, write batch and
    streaming jobs, and help hardware engineers find failures faster. You know Python and SQL well and you have
    run data pipelines in production.
  role_nocomp: >-
    Our client is hiring a machine learning engineer to build forecasting models for a regional retailer. You will
    work with analysts to define targets, build features from sales and inventory data, train models in Python and
    deploy them on a cloud platform. Contract to hire, hybrid, three days on site.
  about_epsilon: >-
    About Epsilon. Epsilon makes software for hospitals and clinics.
  team_epsilon_a: >-
    The Scheduling team builds the services that book appointments for millions of patients. You will write Go
    services, design APIs used by our mobile apps, and keep the booking flow fast and reliable during flu season.
    You care about clear interfaces, careful migrations and on call that stays quiet.
  team_epsilon_b: >-
    The Imaging team builds the viewer that radiologists use all day. You will write TypeScript and C plus plus,
    render large scans in the browser, and work with clinicians to make reading studies faster and less tiring.
    You care about performance, accessibility and pixels that are exactly right.
  role_zeta: >-
    Zeta is looking for a machine learning engineer to work on search quality for an online marketplace. You will
    build query understanding and ranking models, run experiments and partner with the product team on metrics.
    Python and production experience with ranking systems are required.
  role_eta: >-
    Eta is hiring a research engineer to build evaluation tools for large language models. You will write data
    pipelines, design benchmarks and help researchers run experiments at scale on a shared cluster.

  role_iota: >-
    Iota Motion builds the simulation stack behind its autonomous delivery robots. As a machine learning engineer on
    sensor simulation you will model lidar, radar and camera returns, train generative models of rare road scenes,
    and measure how well the simulated sensors predict what the robots see on real streets. You write Python and C
    plus plus, you are comfortable with large GPU jobs, and you like working next to the hardware team.
  role_kappa: >-
    Kappa Learning helps teachers give feedback at scale. The analytics engineering team turns raw product events into
    trusted tables, dashboards and models that school districts use to decide where to spend their budgets. You will
    write SQL and Python, design dimensional models, own the data quality checks, and present findings to customers.
    This is a hybrid role with two days a week in the office nearest to you.
  role_mu: >-
    Mu Payments is hiring a data scientist for payments risk management and analytics. You will build loss forecasts,
    design experiments for new risk rules, size the impact of fraud attacks and explain your findings to product and
    finance partners. Strong SQL and Python are required, together with a solid grounding in statistics and a habit
    of checking the data before trusting a result. Experience in payments or credit risk is a plus.
  role_nu: >-
    Nu Networks is looking for a security operations engineer to defend a global network that carries a large share
    of the world's internet traffic. You will triage alerts, write detections, automate response playbooks in Python,
    and run tabletop exercises with the incident response team. Experience with SIEM tools, cloud logging and threat
    hunting is required. Shift coverage is shared fairly across the team and on call is paid.
  role_xi: >-
    Xi Logistics is hiring a machine learning engineer for routing. You will build models that predict travel times,
    choose pickup windows and balance loads across depots, and you will ship them into a planning service used by
    thousands of drivers every morning. Python, SQL and experience with optimization or forecasting in production are
    required. You will work closely with operations analysts who know every depot by name.
  role_omicron: >-
    Omicron Cloud is hiring an applied scientist for payment risk. You will research and build machine learning
    models that stop fraudulent transactions while letting good customers pay without friction. You will design
    features from transaction graphs, run offline and online evaluations, and publish internal papers on what worked
    and what did not. A graduate degree in a quantitative field and strong Python skills are required.
  role_omicron2: >-
    Omicron Cloud is hiring a senior applied scientist to lead research on seller risk. You will set the research
    agenda, mentor scientists, and turn models that detect abusive sellers into production systems with the
    engineering team. You will write papers, review designs and represent the team in planning. A doctorate or
    equivalent research experience and a record of shipped machine learning systems are required.
  role_pi: >-
    Pi Video is hiring new graduates to join the e-commerce user growth team as machine learning engineers. You will
    build recommendation and ranking models that help shoppers find products they love, run online experiments, and
    work with product managers to define success metrics. You should be graduating with a degree in computer science
    or a related field and be fluent in Python. Experience with large scale data processing is a plus.
  role_pi2: >-
    Pi Video is hiring new graduates as data engineers on the creator analytics team. You will build batch and
    streaming pipelines that count views, likes and earnings for millions of creators, design tables that analysts can
    trust, and keep the pipelines healthy with tests and alerts. You should be graduating with a degree in computer
    science or a related field and know SQL and one of Python, Java or Scala well.
  role_rho: >-
    Rho Health is hiring a machine learning engineer to work on clinical documentation. You will fine tune language
    models that draft visit notes from conversations, build evaluation sets with clinicians, and keep patient data safe
    at every step. Python and production experience with natural language processing are required. You will join a
    small team that ships every week and talks to doctors every day.
  role_sigma: >-
    Sigma Systems is hiring a platform engineer to build the internal developer platform used by every product team.
    You will run Kubernetes clusters, write the tooling that turns a service template into a running deployment, and
    improve build times across a large monorepo. Go or Python, solid Linux knowledge and experience operating
    production infrastructure are required. You will share on call with the rest of the platform team.
  role_tau: >-
    Tau Devices is hiring a backend engineer for its AI platform and cloud native services. You will design APIs and
    services that serve models to millions of devices, run them on Kubernetes across several regions, and keep them
    fast and reliable. Java or Go, experience with distributed systems and a habit of writing tests first are
    required. You will work with researchers who train the models and teams who build the devices.
  role_upsilon: >-
    Our client, a regional retailer, is hiring a data analyst to support its merchandising team. You will build weekly
    sales and inventory reports, answer questions about promotions and pricing, and automate recurring analyses in SQL
    and Python. You will present to buyers and store managers and help them read the numbers. Hybrid, three days a
    week in the head office, full time, with a yearly bonus.
  role_phi: >-
    Phi Pay is looking for a manager of data science and machine learning for risk and fraud. You will lead a team of
    scientists and engineers who build the models that approve or decline payments in real time, set the roadmap with
    product and operations, and hire and grow the team. You have managed data scientists before, you know fraud
    patterns in payments, and you can explain model tradeoffs to executives in plain words.
  role_chi: >-
    Chi Commerce is hiring a senior machine learning engineer for its new verticals team, which brings grocery,
    convenience and retail delivery to the marketplace. You will build ranking, search and substitution models,
    measure them in online experiments and work with product and operations to launch in new cities. Python, deep
    learning frameworks and production experience with recommendation systems are required.
  role_chi_other: >-
    Chi Commerce is hiring a senior machine learning engineer to work on logistics for its new verticals. You will
    forecast demand by store and hour, decide how many shoppers each store needs, and build the models behind delivery
    time promises. You will partner with operations teams in every market. Python, forecasting experience in production
    and comfort with messy real world data are required.

