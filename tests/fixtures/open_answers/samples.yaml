# SYNTHETIC: an invented applicant (Sam Example) and invented answers; nothing here comes from a real applicant or a
# real knowledge base. Cases O1-O9 of specs/open-answers.samples.md. Each case's `bank` is written to
# open_answers.yaml as it is; `expect` says what loading it and writing the instructions must show.
synthetic: true
profile:                      # ApplyPilot's format; the contact values the bank is checked against
  personal:
    full_name: Sam Example
    email: sam.synthetic@example.test
    phone: 555-0100
    address: 1 Synthetic Way
    city: Austin
    postal_code: "00000"
    linkedin_url: https://www.linkedin.com/in/sam-synthetic
    password: synthetic-password-1
cases:
  - id: O1
    title: a typical bank, several types, a draft and a retired entry
    bank:
      version: 1
      entries:
        - id: why-role-ranking
          type: why_role
          question: Why do you want to work on search ranking at our company?
          text: |-
            Ranking is where I learned that a model is only as good as the question it answers.
            On my last team I chose which signals to trust before I tuned anything.
            Your team owns that choice for the whole product, and that is the work I want.
          status: accepted
          source_words:
            - 我喜欢排序，因为它逼我先想清楚到底在优化什么。
          rejected:
            - I am passionate about building the future of search.
          notes: Say what the team owns, never praise the company in general.
          from: SYNTHETIC chat 2026-11-02, the applicant edited and accepted this text
          added: 2026-11-02
        - id: about-me-short
          type: about_me
          question: Tell us about yourself.
          text: |-
            I build models that other engineers can trust.
            I started in statistics, moved to machine learning, and stayed for the debugging.
          status: accepted
          from: SYNTHETIC chat 2026-11-02, the applicant typed this answer
        - id: why-role-draft
          type: why_role
          question: What draws you to this role?
          text: A draft the applicant has not accepted yet.
          status: draft
        - id: anything-else-old
          type: anything_else
          question: Anything else you would like us to know?
          text: An old answer the applicant stopped using.
          status: retired
          from: SYNTHETIC chat 2026-10-20
        - id: anything-else-gap
          type: anything_else
          question: Is there anything else you would like us to know?
          text: My resume lists the projects; what it does not show is that I asked to own the unglamorous parts.
          status: accepted
          rejected:
            - I am a fast learner and a team player.
            - Thank you for considering my application.
          from: SYNTHETIC chat 2026-11-02, the applicant chose option 2
        - id: other-mentor
          type: other
          question: Describe a time you mentored someone.
          text: I paired with a new teammate on their first model review and let them lead the second one.
          status: accepted
          from: SYNTHETIC chat 2026-11-02
    expect:
      problems: []
      accepted: [why-role-ranking, about-me-short, anything-else-gap, other-mentor]
      section_in_order:     # appear in this order: types follow the closed set, entries follow the file
        - "== OPEN ANSWER EXAMPLES =="
        - "-- why_role:"
        - "Why do you want to work on search ranking at our company?"
        - "Ranking is where I learned"
        - "Rejected wording (never use): \"I am passionate about building the future of search.\""
        - "Note: Say what the team owns"
        - "-- about_me:"
        - "I build models that other engineers can trust."
        - "-- anything_else:"
        - "\"I am a fast learner and a team player.\"; \"Thank you for considering my application.\""
        - "-- other:"
        - "Describe a time you mentored someone."
      section_lacks:        # drafts, retired entries, source words and the from line never reach the agent
        - A draft the applicant has not accepted yet.
        - An old answer the applicant stopped using.
        - 我喜欢排序
        - SYNTHETIC chat
        - "-- origin:"

  - id: O2
    title: contact details in an entry are refused by field and kind, never echoed
    bank:
      version: 1
      entries:
        - id: about-me-contact
          type: about_me
          question: Tell us about yourself. See https://www.linkedin.com/in/sam-synthetic
          text: Reach me at sam.synthetic@example.test any time.
          status: accepted
          notes: Or call 555-0100.
          rejected:
            - Write to my old address, someone.else@example.org.
          from: SYNTHETIC chat 2026-11-02
    expect:
      problems:
        - "entries[0] (about-me-contact).question: contains contact details (url)"
        - "entries[0] (about-me-contact).text: contains contact details (email)"
        - "entries[0] (about-me-contact).rejected[0]: contains contact details (other_email)"
        - "entries[0] (about-me-contact).notes: contains contact details (phone)"
      never_echoed: [sam.synthetic, 555-0100, someone.else, linkedin.com/in/sam]

  - id: O3
    title: duplicate ids
    bank:
      version: 1
      entries:
        - {id: why-role, type: why_role, question: "Why us?", text: First answer., status: accepted, from: SYNTHETIC}
        - {id: why-role, type: why_role, question: "Why this team?", text: Second answer., status: draft}
    expect:
      problems: ["entries[1] (why-role): duplicate id 'why-role'"]

  - id: O4
    title: only drafts and retired entries; the instructions stay as they were
    bank:
      version: 1
      entries:
        - {id: draft-one, type: about_me, question: "Tell us about yourself.", text: Not accepted yet., status: draft}
        - id: retired-one
          type: why_role
          question: Why us?
          text: No longer used.
          status: retired
          from: SYNTHETIC chat 2026-10-01
    expect:
      problems: []
      accepted: []
      unchanged: true

  - id: O5
    title: an empty bank; the instructions stay as they were
    bank: {version: 1, entries: []}
    expect:
      problems: []
      accepted: []
      unchanged: true

  - id: O6
    title: schema problems are all listed together
    bank:
      version: 2
      colour: blue
      entries:
        - {id: Bad Id, type: why_role, question: "Why us?", text: Fine., status: accepted, from: SYNTHETIC}
        - {id: no-type, type: hobbies, question: "Hobbies?", text: Chess., status: accepted, from: SYNTHETIC}
        - {id: no-from, type: about_me, question: "About you?", text: Something., status: accepted}
        - {id: empty-text, type: about_me, question: "About you?", text: "  ", status: draft}
        - {id: bad-status, type: about_me, question: "About you?", text: Something., status: final}
        - {id: extra, type: about_me, question: "About you?", text: Something., status: draft, score: 5}
        - {id: empty-rejected, type: about_me, question: "About you?", text: Something., status: draft, rejected: [""]}
        - just a string
    expect:
      problems:
        - "version must be 1"
        - "unknown field 'colour'"
        - "entries[0]: id:"
        - "entries[1]: type:"
        - "entries[2] (no-from): an accepted entry needs from"
        - "entries[3] (empty-text): question and text must not be empty"
        - "entries[4]: status:"
        - "entries[5]: score:"
        - "entries[6] (empty-rejected): rejected must not hold empty text"
        - "entries[7]: must be a mapping"

  - id: O7
    title: non-English source words are kept and never injected
    bank:
      version: 1
      entries:
        - id: origin-zh
          type: origin
          question: How did you get into machine learning?
          text: A statistics course made me want to know why a model is wrong, not only that it is.
          status: accepted
          source_words:
            - 统计课上老师问"这个模型错在哪"，我一直记得。
            - モデルの間違いを探すのが好きです。
          from: SYNTHETIC chat 2026-11-02, the applicant answered in Chinese and accepted the English draft
    expect:
      problems: []
      accepted: [origin-zh]
      section_in_order: ["-- origin:", "A statistics course made me want to know"]
      section_lacks: [统计课, モデル]
