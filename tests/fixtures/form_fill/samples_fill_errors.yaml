# SYNTHETIC: invented applicant, companies and schools. The page shapes and the mistakes copy what the user marked on
# real tabs (decisions 15 and 16): a LinkedIn Easy Apply review step with company and city written in Chinese and two
# experiences the answer sheet does not have (a research assistant job, a job missing from the resumes); a Workday
# review page with a country after the city and Field of Study left on "No Response"; an Ashby single page with
# Location empty and the "may we contact you" box unticked; contact values as the saved pages show them (masked).
# Each page: fields in page order as [question, value, control]; ids are p1.1, p1.2 ... in that order.
# expect: field id -> key (null when no entry applies), result, severity (none when left out).
# missing: record entries the page should have had (it shows that kind of segment, but not this one).
synthetic: true
answers:
  name.legal: {answer: Sam Synthetic, kind: text}
  name.first: {answer: Sam, kind: text}
  name.last: {answer: Synthetic, kind: text}
  contact.email: {from_profile: personal.email}
  contact.phone: {from_profile: personal.phone}
  contact.city: {from_profile: personal.city}
  screening.contact_consent:
    answer: "Yes"
    kind: yes_no
    asks: ["contact you about job opportunities", "contact you about future opportunities"]
  experience.vista:
    kind: record
    company: Vista Video Inc.
    aliases: ["Vista"]
    title: Software Engineer Intern
    start: 2026-06
    end: 2026-09
    city: San Jose
  experience.lumen:
    kind: record
    company: Lumen Search (China) Co., Ltd.
    aliases: ["Lumen"]
    title: Machine Learning Engineer Intern
    start: 2024-06
    end: 2024-08
    city: Hangzhou
  education.ms_esu:
    kind: record
    school: Example State University
    aliases: ["ESU"]
    degree: Master of Science
    major: Statistics
    start: 2025-09
    end: 2026-12
    city: Springfield
    accept: {degree: ["MS", "M.S."]}
  education.beng_nru:
    kind: record
    school: Northern River University
    aliases: ["NRU"]
    degree: Bachelor of Engineering
    major: Geographic Information System
    start: 2021-09
    end: 2025-06
    city: Riverton
    accept: {degree: ["BS", "B.Eng."], major: ["Remote Sensing Science and Technology"]}
    otherwise: {major: Computer Science}
