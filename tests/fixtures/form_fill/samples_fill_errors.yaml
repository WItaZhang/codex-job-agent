      p1.30: {key: education.beng_nru, result: correct}
      p1.31: {key: education.beng_nru, result: correct}
      p1.32: {key: education.beng_nru, result: correct}
      p1.33: {key: education.beng_nru, result: correct}
      p1.34: {key: education.beng_nru, result: correct}
