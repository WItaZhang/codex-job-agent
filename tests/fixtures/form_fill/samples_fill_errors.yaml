      - [Follow Example Corp to stay up to date with their page, "Yes", checkbox]
    expect:
      p1.1: {key: name.first, result: correct}
      p1.2: {key: name.last, result: correct}
      p1.3: {key: contact.email, result: correct}
      p1.4: {key: contact.phone, result: correct}
      p1.5: {key: contact.city, result: correct}
      p1.6: {key: experience.vista, result: correct}
      p1.7: {key: experience.vista, result: correct}
      p1.8: {key: experience.vista, result: correct}
      p1.9: {key: experience.vista, result: wrong, severity: fact, note: the city written in Chinese and with the state}
      p1.10: {key: experience.vista, result: not_reviewed}
      p1.11: {key: null, result: wrong, severity: fact, note: a research assistant job is not on the answer sheet}
      p1.12: {key: null, result: wrong, severity: fact}
      p1.13: {key: null, result: wrong, severity: fact}
