      - [Mobile phone number, "[phone]", review]
      - [Location (city), "[address], Texas, United States", review]
      - [Your title, Software Engineer Intern, review]
      - [Company, Vista Video Inc., review]
      - [Dates of employment, 6 / 2026 - 9 / 2026, review]
      - [City, "圣何塞, CA", review]
      - [Description, Built a video ranking service., review]
      - [Your title, Research Assistant, review]
      - [Company, Example State University, review]
      - [Dates of employment, 1 / 2025 - 12 / 2025, review]
      - [City, N/A, review]
      - [Description, Research in image quality assessment., review]
      - [Your title, Machine Learning Engineer Intern, review]
      - [Company, 鲁门（Lumen）, review]
      - [Dates of employment, 6 / 2024 - 8 / 2024, review]
      - [City, "杭州市, 中国", review]
      - [Description, Built credit risk models., review]
      - [Your title, Intern, review]
      - [Company, Orbit Tech, review]
      - [Dates of employment, 7 / 2023 - 8 / 2023, review]
      - [City, N/A, review]
      - [School, ESU, review]
      - [City, N/A, review]
      - [Degree, Master of Science, review]
      - [Major / Field of study, Statistics, review]
      - [Dates attended, 9 / 2025 - 3 / 2027, review]
      - [School, Northern River University, review]
      - [City, Riverton, review]
      - [Degree, Bachelor of Engineering, review]
      - [Major / Field of study, Remote Sensing Science and Technology, review]
      - [Dates attended, 9 / 2021 - 6 / 2025, review]
