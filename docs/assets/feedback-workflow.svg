<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img" aria-labelledby="title desc">
  <title id="title">从岗位发现到推荐、投递与经验复用</title>
  <desc id="desc">发现的岗位按偏好筛选，分别用于每日推荐和投递清单；用户反馈用于校准偏好。另一路操作经验循环记录抓取和申请的脱敏过程，由在线宿主在批次结束后进行 dreaming 复盘，形成带来源、范围和期限的经验，供下一轮执行前读取。这些操作经验不改变求职偏好；宿主关闭后保留复盘待办。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#979A9F" stroke-width="1.2"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#B74A2B" stroke-width="1.2"/>
    </marker>
    <marker id="experience-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2D6C8E" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="524" fill="#FFFFFF"/>
  <g fill="none" stroke="#979A9F" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M206 110 H272"/>
    <path d="M458 110 H524"/>
    <path d="M364 150 V219"/>
    <path d="M458 244 H524"/>
  </g>
  <path d="M624 78 V34 H364 V78" fill="none" stroke="#B74A2B" stroke-width="1.3" marker-end="url(#feedback-arrow)"/>
  <path d="M36 310 H724" fill="none" stroke="#E3E7EA"/>
  <g fill="none" stroke="#2D6C8E" stroke-width="1.3" marker-end="url(#experience-arrow)">
    <path d="M176 386 H211"/>
    <path d="M358 386 H389"/>
    <path d="M540 386 H571"/>
    <path d="M650 428 V460 H104 V428"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="407" y="23" width="174" height="22" fill="#FFFFFF"/>
    <text x="494" y="39" text-anchor="middle" font-size="16" fill="#B74A2B">你的反馈，校准偏好</text>

    <text x="36" y="114" font-size="25" font-weight="600" fill="#25282C">发现岗位</text>
    <text x="36" y="142" font-size="17" fill="#6F747A">搜索 / 招聘板 / 导入</text>

    <text x="292" y="114" font-size="25" font-weight="600" fill="#25282C">按偏好筛选</text>
    <text x="292" y="142" font-size="17" fill="#6F747A">硬性条件与偏好排序</text>

    <text x="548" y="114" font-size="25" font-weight="600" fill="#B74A2B">推荐与探索</text>
    <text x="548" y="142" font-size="17" fill="#6F747A">默认每天最多 7 + 3</text>

    <text x="292" y="248" font-size="25" font-weight="600" fill="#25282C">投递清单</text>
    <text x="292" y="276" font-size="17" fill="#6F747A">导出或交给助手</text>

    <text x="548" y="248" font-size="25" font-weight="600" fill="#25282C">按授权投递</text>
    <text x="548" y="276" font-size="17" fill="#6F747A">求职信与申请表</text>

    <text x="36" y="342" font-size="16" font-weight="600" fill="#2D6C8E">操作经验：让下一轮参考本轮经历</text>
    <g text-anchor="middle">
      <text x="104" y="392" font-size="22" font-weight="600" fill="#25282C">抓取 / 申请</text>
      <text x="104" y="418" font-size="15" fill="#6F747A">本轮执行</text>

      <text x="286" y="392" font-size="22" font-weight="600" fill="#25282C">脱敏记录</text>
      <text x="286" y="418" font-size="15" fill="#6F747A">每轮独立保存</text>

      <text x="468" y="392" font-size="22" font-weight="600" fill="#2D6C8E">批次复盘</text>
      <text x="468" y="418" font-size="15" fill="#6F747A">dreaming</text>

      <text x="650" y="392" font-size="22" font-weight="600" fill="#25282C">操作经验</text>
      <text x="650" y="418" font-size="15" fill="#6F747A">来源 / 范围 / 期限</text>

      <rect x="260" y="449" width="234" height="22" fill="#FFFFFF"/>
      <text x="377" y="466" font-size="16" fill="#2D6C8E">下一轮执行前读取相关经验</text>
      <text x="380" y="504" font-size="14" fill="#6F747A">在线宿主自动整理；关闭后保留待办。操作经验不改变求职偏好。</text>
    </g>
  </g>
</svg>
