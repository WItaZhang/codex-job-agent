<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" role="img" aria-labelledby="title desc">
  <title id="title">从岗位发现到推荐与投递</title>
  <desc id="desc">发现的岗位按偏好筛选，分别用于每日推荐和投递清单。推荐反馈用于校准偏好。清单可导出自行投递，也可交给助手准备材料并按授权投递。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#979A9F" stroke-width="1.2"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#B74A2B" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="304" fill="#FFFFFF"/>
  <g fill="none" stroke="#979A9F" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M206 110 H272"/>
    <path d="M458 110 H524"/>
    <path d="M364 150 V219"/>
    <path d="M458 244 H524"/>
  </g>
  <path d="M624 78 V34 H364 V78" fill="none" stroke="#B74A2B" stroke-width="1.3" marker-end="url(#feedback-arrow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="407" y="23" width="174" height="22" fill="#FFFFFF"/>
    <text x="494" y="39" text-anchor="middle" font-size="16" fill="#B74A2B">你的反馈，校准偏好</text>

    <text x="36" y="114" font-size="25" font-weight="600" fill="#25282C">发现岗位</text>
    <text x="36" y="142" font-size="17" fill="#6F747A">搜索 / 招聘板 / 导入</text>

    <text x="292" y="114" font-size="25" font-weight="600" fill="#25282C">按偏好筛选</text>
    <text x="292" y="142" font-size="17" fill="#6F747A">硬性条件与偏好排序</text>

    <text x="548" y="114" font-size="25" font-weight="600" fill="#B74A2B">推荐与探索</text>
    <text x="548" y="142" font-size="17" fill="#6F747A">默认每天最多 7 + 3</text>

    <text x="292" y="248" font-size="25" font-weight="600" fill="#25282C">投递清单</text>
    <text x="292" y="276" font-size="17" fill="#6F747A">导出或交给助手</text>

    <text x="548" y="248" font-size="25" font-weight="600" fill="#25282C">按授权投递</text>
    <text x="548" y="276" font-size="17" fill="#6F747A">求职信与申请表</text>
  </g>
</svg>
