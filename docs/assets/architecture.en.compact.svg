<title id="title">Codex Job Agent: how it works</title>
<desc id="desc">Your experience and goals guide Codex to discover opportunities and tailor applications, with more attention to strong matches. Your submission rules independently determine automatic application or your review before submission. Track applications and next actions, then use your feedback to refine the next search.</desc>
