<text x="50" y="337" font-size="33" font-weight="700" text-anchor="start" style="fill:#20252C" class="serif">Codex</text>
<text x="628" y="333" font-size="18" font-weight="400" text-anchor="end" style="fill:#625781" class="mono">REASONING HOST</text>
<text x="50" y="376" font-size="24" font-weight="400" text-anchor="start" style="fill:#20252C">plan · research · compose · revise</text>
