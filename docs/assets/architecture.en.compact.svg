<text x="28" y="942" font-size="24" font-weight="600" text-anchor="start" style="fill:#326B68">Runtime audit</text>
<text x="28" y="978" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">Frozen packet → sample</text>
<text x="28" y="1014" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">Review → user inbox</text>
<text x="370" y="942" font-size="24" font-weight="600" text-anchor="start" style="fill:#20252C">Development</text>
<text x="370" y="978" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">RCA · regression</text>
<text x="370" y="1014" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">Reviewed changes</text>
<text x="28" y="1066" font-size="21" font-weight="400" text-anchor="start" style="fill:#626A73" font-style="italic">Freeze before submit; sample after confirmation.</text>
