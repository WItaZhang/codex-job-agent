<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="792" viewBox="0 0 1180 792" role="img" aria-labelledby="title desc">
<title id="title">Codex Job Agent — system architecture</title>
<desc id="desc">Personal context conditions the Codex planner. Repository skills guide one reasoning host. Structured actions and observations connect Codex to local tools and persistent state. Reading job sites is separate from submission, which checks authorization, packet version and budget. Observed acknowledgement or an unknown result returns to the tools. Packets are frozen before submission; confirmed submissions can be sampled for independent reviews and user feedback. Development validation and reviewed changes are separate from runtime activity.</desc>
