<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1128" viewBox="0 0 680 1128" role="img" aria-labelledby="title desc">
<title id="title">Codex Job Agent — system architecture</title>
<desc id="desc">窄屏系统图：用户上下文指导 Codex 的动作与观察循环。本地工具区分读取与获准后的提交，持久保存岗位和证据并观察结果。运行期抽样评审与开发期验证分别展示。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4 L0 8 Z" fill="#20252C"/></marker>
<marker id="audit" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4 L0 8 Z" fill="#326B68"/></marker>
</defs>
<rect width="680" height="1128" fill="#FFFFFF"/>
<style>text{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;fill:#20252C} .serif{font-family:Georgia,"Noto Serif CJK SC",SimSun,serif}.mono{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace}</style>
<text x="28" y="36" font-size="21" font-weight="700" text-anchor="start" style="fill:#20252C">CODEX JOB AGENT</text>
<text x="652" y="36" font-size="19" font-weight="400" text-anchor="end" style="fill:#626A73" class="mono">01</text>
<path d="M28 57 H652" fill="none" stroke="#20252C" stroke-width="1.2"/>
<text x="28" y="102" font-size="24" font-weight="700" text-anchor="start" style="fill:#20252C" class="serif">(a)</text>
<text x="80" y="102" font-size="24" font-weight="600" text-anchor="start" style="fill:#20252C">个性化上下文</text>
<rect x="28" y="126" width="624" height="98" fill="#FAFAF8" stroke="#C5C9CC" stroke-width="1.2"/>
<path d="M236 142 V182 M444 142 V182" fill="none" stroke="#C5C9CC" stroke-width="0.8"/>
<text x="132" y="164" font-size="23" font-weight="600" text-anchor="middle" style="fill:#20252C">确认事实</text>
<text x="340" y="164" font-size="23" font-weight="600" text-anchor="middle" style="fill:#20252C">偏好与约束</text>
<text x="548" y="164" font-size="23" font-weight="600" text-anchor="middle" style="fill:#20252C">投递授权</text>
<text x="340" y="205" font-size="20" font-weight="400" text-anchor="middle" style="fill:#626A73">用户确认的资料与提交策略</text>
<path d="M340 231 V286" fill="none" stroke="#20252C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="28" y="268" font-size="24" font-weight="700" text-anchor="start" style="fill:#20252C" class="serif">(b)</text>
<text x="80" y="268" font-size="24" font-weight="600" text-anchor="start" style="fill:#20252C">Agent 与工具</text>
<rect x="28" y="294" width="624" height="155" fill="#F5F3F8" stroke="#625781" stroke-width="1.3"/>
<text x="50" y="337" font-size="33" font-weight="700" text-anchor="start" style="fill:#20252C" class="serif">Codex</text>
<text x="628" y="333" font-size="18" font-weight="400" text-anchor="end" style="fill:#625781" class="mono">推理宿主</text>
<text x="50" y="376" font-size="24" font-weight="400" text-anchor="start" style="fill:#20252C">动态规划 · 研究岗位 · 写作 · 重新判断</text>
<path d="M50 397 H630" fill="none" stroke="#D8D2E3" stroke-width="0.8"/>
<text x="50" y="428" font-size="22" font-weight="400" text-anchor="start" style="fill:#625781">四个仓库技能提供领域方法</text>
<path d="M215 456 V526" fill="none" stroke="#20252C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="198" y="498" font-size="22" font-weight="400" text-anchor="end" style="fill:#626A73" class="mono">动作</text>
<path d="M370 526 V456" fill="none" stroke="#20252C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="388" y="498" font-size="22" font-weight="400" text-anchor="start" style="fill:#626A73" class="mono">观察</text>
<rect x="28" y="534" width="404" height="230" fill="#FFFFFF" stroke="#C5C9CC" stroke-width="1.2"/>
<text x="50" y="572" font-size="27" font-weight="600" text-anchor="start" style="fill:#20252C">本地工具</text>
<text x="50" y="609" font-size="22" font-weight="400" text-anchor="start" style="fill:#626A73">发现 · 观察 · 材料准备</text>
<rect x="48" y="632" width="364" height="111" fill="#F0F6F4" stroke="#326B68" stroke-width="1.15"/>
<text x="66" y="667" font-size="25" font-weight="600" text-anchor="start" style="fill:#326B68">提交前检查</text>
<text x="66" y="703" font-size="23" font-weight="400" text-anchor="start" style="fill:#326B68">授权 · 申请包版本</text>
<text x="66" y="730" font-size="23" font-weight="400" text-anchor="start" style="fill:#326B68">预算 · 提交意图</text>
<rect x="500" y="555" width="152" height="188" fill="#FAFAF8" stroke="#C5C9CC" stroke-width="1.2"/>
<text x="576" y="599" font-size="24" font-weight="600" text-anchor="middle" style="fill:#20252C">招聘网站</text>
<text x="576" y="633" font-size="24" font-weight="400" text-anchor="middle" style="fill:#20252C">ATS</text>
<path d="M518 649 H634" fill="none" stroke="#C5C9CC" stroke-width="1"/>
<text x="576" y="683" font-size="21" font-weight="400" text-anchor="middle" style="fill:#626A73">网页回执</text>
<text x="576" y="716" font-size="21" font-weight="400" text-anchor="middle" style="fill:#626A73">或结果未知</text>
<path d="M439 587 H493" fill="none" stroke="#20252C" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="466" y="569" font-size="17" font-weight="400" text-anchor="middle" style="fill:#626A73">读取</text>
<path d="M439 703 H493" fill="none" stroke="#20252C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="466" y="685" font-size="17" font-weight="400" text-anchor="middle" style="fill:#326B68">提交</text>
<path d="M110 771 V788 H340" fill="none" stroke="#C5C9CC" stroke-width="1.3"/>
<text x="340" y="818" font-size="23" font-weight="400" text-anchor="middle" style="fill:#626A73">持久状态：岗位、申请包与事件</text>
<path d="M28 850 H652" fill="none" stroke="#C5C9CC" stroke-width="1"/>
<text x="28" y="891" font-size="24" font-weight="700" text-anchor="start" style="fill:#20252C" class="serif">(c)</text>
<text x="80" y="891" font-size="24" font-weight="600" text-anchor="start" style="fill:#20252C">证据与评测</text>
<path d="M340 920 V1030" fill="none" stroke="#C5C9CC" stroke-width="1" stroke-dasharray="5 4"/>
<text x="28" y="942" font-size="24" font-weight="600" text-anchor="start" style="fill:#326B68">运行期抽检</text>
<text x="28" y="978" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">冻结申请包 → 确认后抽样</text>
<text x="28" y="1014" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">独立评审 → 用户待办</text>
<text x="370" y="942" font-size="24" font-weight="600" text-anchor="start" style="fill:#20252C">开发期验证</text>
<text x="370" y="978" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">根因分析 · 回归比较</text>
<text x="370" y="1014" font-size="22" font-weight="400" text-anchor="start" style="fill:#20252C">审核后的实现修改</text>
<text x="28" y="1066" font-size="21" font-weight="400" text-anchor="start" style="fill:#626A73">提交前冻结证据，确认投递后抽样。</text>
<path d="M28 1090 H652" fill="none" stroke="#20252C" stroke-width="1"/>
<text x="28" y="1116" font-size="19" font-weight="400" text-anchor="start" style="fill:#626A73">运行期不自行改写实现</text>
</svg>
