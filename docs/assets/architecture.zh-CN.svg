<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
  <title id="title">Codex 求职 Agent 架构</title>
  <desc id="desc">用户提供背景、求职偏好和投递授权。Codex 负责理解、研究、动态规划与材料撰写，由四个仓库技能组织领域操作。本地 Python 工具负责事实与状态、执行检查，以及外部招聘网站的岗位发现和申请操作。运行证据进入独立质量评审，再推动经过审核的开发改进。运行时不会自行修改代码、技能或评测标准。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#718596" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#228678" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1080" height="780" rx="20" fill="#F6F8FA"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172D40">
    <text x="40" y="53" font-size="30" font-weight="700" letter-spacing="-0.4">Codex 负责决策，本地工具负责执行</text>
    <text x="40" y="83" font-size="19" fill="#5B6D7C">一个个人求职 Agent，清晰分离推理、外部操作与质量改进。</text>

    <rect x="40" y="108" width="1000" height="62" rx="12" fill="#E9EFF4"/>
    <circle cx="72" cy="139" r="13" fill="#D3DFE8"/>
    <circle cx="72" cy="135" r="4" fill="#506B80"/>
    <path d="M65 145 C65 139 79 139 79 145" fill="#506B80"/>
    <text x="98" y="146" font-size="21" font-weight="650">用户</text>
    <path d="M165 125 V153" stroke="#C6D3DD"/>
    <text x="190" y="146" font-size="20">背景事实</text>
    <circle cx="329" cy="139" r="2.5" fill="#92A3B1"/>
    <text x="351" y="146" font-size="20">求职偏好</text>
    <circle cx="491" cy="139" r="2.5" fill="#92A3B1"/>
    <text x="513" y="146" font-size="20">自动投递与人工审核的边界</text>
    <path d="M540 174 V186" fill="none" stroke="#718596" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="40" y="190" width="1000" height="170" rx="16" fill="#172D40"/>
    <rect x="64" y="216" width="5" height="24" rx="2.5" fill="#66CDB7"/>
    <text x="84" y="237" font-size="29" font-weight="700" fill="#FFFFFF">Codex</text>
    <text x="197" y="236" font-size="20" fill="#BBD1DF">理解、推理与任务编排</text>
    <text x="64" y="274" font-size="21" fill="#F1F5F8">理解用户需求 · 研究岗位 · 动态规划 · 撰写申请材料</text>
    <text x="64" y="322" font-size="18" font-weight="600" fill="#BBD1DF">仓库技能集</text>
    <g fill="#2B4356">
      <rect x="250" y="297" width="180" height="36" rx="8"/>
      <rect x="444" y="297" width="180" height="36" rx="8"/>
      <rect x="638" y="297" width="180" height="36" rx="8"/>
      <rect x="832" y="297" width="184" height="36" rx="8"/>
    </g>
    <g font-size="18" fill="#FFFFFF" text-anchor="middle">
      <text x="340" y="321">任务协调</text>
      <text x="534" y="321">个性化适配</text>
      <text x="728" y="321">岗位发现</text>
      <text x="924" y="321">申请准备与执行</text>
    </g>

    <path d="M425 366 V388" fill="none" stroke="#718596" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="447" y="383" font-size="18" fill="#5B6D7C">工具调用 · 结构化结果</text>

    <rect x="40" y="394" width="770" height="190" rx="16" fill="#FFFFFF" stroke="#CDD9E0" stroke-width="1.3"/>
    <rect x="64" y="417" width="5" height="23" rx="2.5" fill="#228678"/>
    <text x="84" y="438" font-size="26" font-weight="700">本地 Python 运行时</text>
    <path d="M64 455 H786" stroke="#E1E8ED"/>
    <path d="M298 476 V559 M547 476 V559" stroke="#E1E8ED"/>
    <g font-size="20" font-weight="650">
      <text x="64" y="488">事实与状态</text>
      <text x="322" y="488">执行条件检查</text>
      <text x="572" y="488">浏览器操作</text>
    </g>
    <g font-size="18" fill="#5B6D7C">
      <text x="64" y="519">已确认事实与来源</text>
      <text x="64" y="547">SQLite · 事件记录</text>
      <text x="322" y="519">授权 · 内容版本</text>
      <text x="322" y="547">预算 · 操作锁</text>
      <text x="572" y="519">观察 · 填写 · 核实</text>
      <text x="572" y="547">提交 · 检查结果</text>
    </g>

    <path d="M816 492 H839" fill="none" stroke="#718596" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="846" y="419" width="194" height="145" rx="14" fill="#E9EFF4"/>
    <text x="943" y="454" text-anchor="middle" font-size="22" font-weight="700">外部招聘网站</text>
    <path d="M870 471 H1016" stroke="#CDD9E0"/>
    <g font-size="18" fill="#506779" text-anchor="middle">
      <text x="943" y="500">公开岗位信息</text>
      <text x="943" y="526">申请表单</text>
    </g>

    <path d="M425 590 V618" fill="none" stroke="#228678" stroke-width="1.8" marker-end="url(#teal-arrow)"/>
    <text x="447" y="610" font-size="18" fill="#377E73">可追溯的运行证据</text>

    <rect x="40" y="624" width="1000" height="124" rx="14" fill="#EAF4F0" stroke="#C8E1D7" stroke-width="1.2"/>
    <text x="64" y="659" font-size="23" font-weight="700" fill="#1D594F">质量评审与反馈</text>
    <g font-size="20" fill="#235F55">
      <text x="64" y="692">冻结材料与证据</text>
      <text x="304" y="692">独立质量评审与反馈</text>
      <text x="620" y="692">经过审核的开发改进</text>
    </g>
    <path d="M235 685 H278" fill="none" stroke="#228678" stroke-width="1.8" marker-end="url(#teal-arrow)"/>
    <path d="M513 685 H591" fill="none" stroke="#228678" stroke-width="1.8" marker-end="url(#teal-arrow)"/>
    <text x="64" y="726" font-size="18" fill="#51766D">运行时不会自行修改代码、技能或评测标准。</text>
  </g>
</svg>
